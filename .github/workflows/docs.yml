name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'examples/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docgen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install c3c
        run: |
          curl -sL https://github.com/c3lang/c3c/releases/download/v0.8.3/c3-linux.tar.gz -o c3.tar.gz
          tar xzf c3.tar.gz
          echo "$PWD/c3" >> "$GITHUB_PATH"

      - name: c3c docgen
        run: c3c docgen --emit-stdlib=no src examples

      # c3c docgen writes one self-contained docs.html into the current
      # directory (preview-docs.sh's own comment says so) — not a directory.
      # Pages needs a directory with index.html at its root.
      - name: Prepare Pages site
        run: |
          mkdir site
          cp docs.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: docgen
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
