name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docgen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install c3c
        run: |
          curl -sL https://github.com/c3lang/c3c/releases/download/v0.8.3/c3-linux.tar.gz -o c3.tar.gz
          tar xzf c3.tar.gz
          echo "$PWD/c3" >> "$GITHUB_PATH"

      - name: c3c docgen
        run: c3c docgen --emit-stdlib=no src

      # run: c3c docgen --emit-stdlib=no src examples

      # docgen's "Defined in" link only special-cases c3lang's own repo
      # (checks window.location.href for c3-lang.org/c3lang.org); every
      # other host, including this one, falls through to a bare relative
      # href — which 404s once served from Pages, since the browser
      # resolves it against the current page instead of GitHub. Patch the
      # one unique line responsible (`href = filePath;`) to build a real
      # GitHub blob URL instead. Fails loudly if the line is gone, so a
      # future c3c version that reshapes this function is caught here
      # rather than silently leaving dead links live.
      - name: Patch "Defined in" links for GitHub
        run: |
          python3 - <<'EOF'
          import sys
          path = "docs.html"
          old = "href = filePath;"
          new = (
              "href = 'https://github.com/g41797/matryoshka-3tk/blob/main/' + filePath;"
              " if (lineStr) href += '#L' + lineStr;"
          )
          text = open(path).read()
          count = text.count(old)
          if count != 1:
              sys.exit(f"expected exactly one match for {old!r} in {path}, found {count}")
          open(path, "w").write(text.replace(old, new, 1))
          EOF

      # c3c docgen writes one self-contained docs.html into the current
      # directory (preview-docs.sh's own comment says so) — not a directory.
      # Pages needs a directory with index.html at its root.
      - name: Prepare Pages site
        run: |
          mkdir site
          cp docs.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: docgen
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
